name: Deploy conciergerie-marrakech to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/new-session-254kpt
    paths:
      - "conciergerie-marrakech/**"
      - ".github/workflows/deploy-conciergerie.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: conciergerie-marrakech
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: conciergerie-marrakech/package-lock.json

      - run: npm ci
      - run: npm run build

      # SPA fallback: GitHub Pages serves 404.html for any unmatched path.
      # Making it a copy of index.html lets React Router handle deep links
      # (e.g. /blank-app/services/menage-linge) and page refreshes — the
      # browser keeps the requested URL, React Router just reads it once the
      # app mounts.
      - run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: conciergerie-marrakech/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
